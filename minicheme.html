<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minicheme — Conceptual Process Planner</title>
<script id="minicheme-snapshot" type="application/json"></script>
<style>
:root {
  --bg: #f6f7fb;
  --dot: #d9deea;
  --surface: #ffffff;
  --surface-2: #f1f3f9;
  --lane: rgba(255,255,255,0.68);
  --lane-border: #e1e6f0;
  --border: #dce1ec;
  --border-strong: #c2cadb;
  --text: #161b26;
  --text-2: #4b5568;
  --text-3: #7d879b;
  --accent: #4f46e5;
  --accent-soft: #eef2ff;
  --accent-text: #3730a3;
  --shadow: 0 1px 2px rgba(15,23,42,0.06), 0 4px 12px rgba(15,23,42,0.04);
  --shadow-lg: 0 12px 32px rgba(15,23,42,0.14);

  --st-blocked: #dc2626;    --st-blocked-bg: #fef2f2;    --st-blocked-bd: #ef4444;
  --st-locked: #b91c1c;     --st-locked-bg: #fff5f5;     --st-locked-bd: #fca5a5;
  --st-pending: #e11d48;    --st-pending-bg: #fff1f2;    --st-pending-bd: #fda4af;
  --st-processing: #2563eb; --st-processing-bg: #eff6ff; --st-processing-bd: #60a5fa;
  --st-solved: #16a34a;     --st-solved-bg: #f0fdf4;     --st-solved-bd: #86efac;
  --st-done: #16a34a;
  --warn: #f59e0b;          --warn-bg: #fef3c7;          --warn-text: #92400e;

  --stage-teal: #0d9488;
  --stage-blue: #2563eb;
  --stage-violet: #7c3aed;
  --stage-amber: #d97706;
  --stage-emerald: #059669;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Menlo, Consolas, monospace;
}

[data-theme="dark"] {
  --bg: #0f1219;
  --dot: #1e2534;
  --surface: #161b26;
  --surface-2: #1d2433;
  --lane: rgba(22,27,38,0.72);
  --lane-border: #252e42;
  --border: #283145;
  --border-strong: #3b4763;
  --text: #eef2fa;
  --text-2: #a9b4c9;
  --text-3: #6e7a92;
  --accent: #6366f1;
  --accent-soft: #1e1f45;
  --accent-text: #c7d2fe;
  --shadow: 0 2px 6px rgba(0,0,0,0.35);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.55);

  --st-blocked: #f87171;    --st-blocked-bg: #361318;    --st-blocked-bd: #ef4444;
  --st-locked: #fca5a5;     --st-locked-bg: #261419;     --st-locked-bd: #7f1d1d;
  --st-pending: #fb7185;    --st-pending-bg: #2d141c;    --st-pending-bd: #be123c;
  --st-processing: #60a5fa; --st-processing-bg: #122342; --st-processing-bd: #3b82f6;
  --st-solved: #4ade80;     --st-solved-bg: #11291c;     --st-solved-bd: #21663e;
  --st-done: #4ade80;
  --warn: #fbbf24;          --warn-bg: #3b2a08;          --warn-text: #fde68a;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); font-size: 13.5px; color: var(--text); background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
code { font-family: var(--mono); font-size: 0.9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

/* Header */
header {
  height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: var(--surface); border-bottom: 1px solid var(--border); z-index: 30; position: relative;
}
.brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; flex-shrink: 0; }
.brand-logo {
  width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #4f46e5, #0d9488);
  color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex-shrink: 0;
}
.proc-btn {
  display: flex; align-items: center; gap: 5px; border: 1px solid transparent; background: transparent;
  padding: 5px 7px; border-radius: 8px; font-weight: 600; max-width: 190px; min-width: 0;
}
.proc-btn:hover { background: var(--surface-2); border-color: var(--border); }
.proc-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pct-pill {
  display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 99px;
  background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--text-2); flex-shrink: 0; white-space: nowrap;
}
.pct-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-solved); }

.filter-pills { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.fpill {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid transparent;
  background: transparent; padding: 2px 6px; border-radius: 99px; font-size: 11.5px; color: var(--text-2);
  white-space: nowrap; transition: background 0.12s, border-color 0.12s;
}
.fpill:hover { background: var(--surface-2); }
.fpill.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.fpill .dot { width: 8px; height: 8px; border-radius: 50%; }
.fpill b { font-weight: 700; color: var(--text); }
.fpill.active b { color: var(--accent-text); }

.spacer { flex: 1; min-width: 4px; }

.search-wrap { position: relative; display: flex; align-items: center; flex-shrink: 0; }
.search-wrap input {
  width: 115px; padding: 5px 20px 5px 22px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); font-size: 12px; outline: none; transition: width 0.15s, border-color 0.15s;
}
.search-wrap input:focus { width: 165px; border-color: var(--accent); background: var(--surface); }
.search-wrap .s-ic { position: absolute; left: 7px; color: var(--text-3); pointer-events: none; font-size: 12px; }
.search-wrap .s-kbd {
  position: absolute; right: 5px; font-size: 10.5px; color: var(--text-3); border: 1px solid var(--border);
  border-radius: 4px; padding: 0 4px; pointer-events: none;
}

.seg {
  display: inline-flex; background: var(--surface-2); padding: 2px; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0;
}
.seg button {
  border: 0; background: transparent; padding: 4px 8px; border-radius: 6px; font-size: 12px;
  color: var(--text-2); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
}
.seg button.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

.icon-btn {
  height: 30px; min-width: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center;
  gap: 5px; font-size: 12.5px; position: relative; flex-shrink: 0; white-space: nowrap;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }
.badge-cnt {
  background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 700; min-width: 17px;
  height: 17px; border-radius: 99px; display: inline-grid; place-items: center; padding: 0 4px;
}
.primary-btn {
  height: 30px; padding: 0 11px; border-radius: 8px; border: 0; background: var(--accent); color: #fff;
  font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
}
.primary-btn:hover { filter: brightness(1.08); }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-solved); flex-shrink: 0; }
.sync-dot.offline { background: var(--warn); }
.sync-dot.readonly { background: var(--st-blocked); }

/* Banners */
.banner {
  background: var(--warn-bg); color: var(--warn-text); padding: 6px 14px; font-size: 12.5px;
  display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--warn);
}

/* Main Workspace */
#app { display: flex; flex-direction: column; height: 100%; }
#workspace { flex: 1; display: flex; position: relative; overflow: hidden; }

/* Side Inspector Panel */
#inspector {
  width: 450px; max-width: 92vw; background: var(--surface); border-right: 1px solid var(--border);
  display: none; flex-direction: column; z-index: 20; box-shadow: var(--shadow-lg); flex-shrink: 0;
}
#inspector.open { display: flex; }
.insp-top {
  padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.id-chip {
  font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
}
.state-select {
  border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); cursor: pointer;
}
.stage-chip {
  font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  background: var(--surface-2); color: var(--text-2); display: inline-flex; align-items: center; gap: 5px;
}
.insp-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
.insp-title { margin: 0 0 10px; font-size: 18px; font-weight: 700; line-height: 1.25; }

.action-card {
  border-radius: 10px; padding: 12px; margin-bottom: 14px; border: 1px solid var(--border);
  background: var(--surface-2);
}
.action-card.blocked { background: var(--st-blocked-bg); border-color: var(--st-blocked-bd); border-width: 1.5px; }
.action-card.processing { background: var(--st-processing-bg); border-color: var(--st-processing-bd); }
.action-card.solved { background: var(--st-solved-bg); border-color: var(--st-solved-bd); }
.action-card h4 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; }
.action-btns { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
.btn {
  padding: 6px 11px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface);
  font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px;
}
.btn:hover { background: var(--surface-2); }
.btn.ok { background: var(--st-done); border-color: var(--st-done); color: #fff; }
.btn.ok:hover { filter: brightness(1.06); }
.btn.warn { background: var(--warn); border-color: var(--warn); color: #111; }
.btn.danger { color: #dc2626; border-color: #fca5a5; }

.sec { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.sec-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3);
}
.md { line-height: 1.55; color: var(--text); font-size: 13px; }
.md p { margin: 0 0 8px; }
.md h1, .md h2, .md h3, .md h4 { margin: 10px 0 5px; font-size: 13.5px; font-weight: 700; }
.md ul, .md ol { margin: 4px 0 8px; padding-left: 18px; }
.md li { margin: 2px 0; }
.md table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 7px; text-align: left; }
.md th { background: var(--surface-2); font-weight: 600; }
.md blockquote { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 6px 6px 0; }
.md pre { background: var(--surface-2); padding: 8px 10px; border-radius: 7px; overflow-x: auto; font-size: 11.5px; border: 1px solid var(--border); }

.param-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.param-table th, .param-table td { border-bottom: 1px solid var(--border); padding: 6px 6px; text-align: left; vertical-align: top; }
.param-table th { font-size: 11px; color: var(--text-3); font-weight: 700; text-transform: uppercase; }
.param-val { font-family: var(--mono); font-weight: 600; color: var(--accent-text); }

.heur-item {
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 7px;
  background: var(--surface-2); cursor: pointer; transition: border-color 0.12s;
}
.heur-item:hover { border-color: var(--accent); }
.heur-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.heur-id {
  font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--accent-text);
  background: var(--accent-soft); padding: 1px 6px; border-radius: 5px;
}
.heur-src { font-size: 11px; color: var(--text-3); }
.heur-applied { font-size: 12.5px; color: var(--text); margin-top: 3px; }
.heur-sum { font-size: 11.5px; color: var(--text-2); }

.dep-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 5px 8px; border-radius: 7px; cursor: pointer; margin-bottom: 4px; background: var(--surface-2);
}
.dep-row:hover { background: var(--accent-soft); }
.dep-row .dep-l { display: flex; align-items: center; gap: 7px; overflow: hidden; }
.dep-row .dep-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }

.note-item {
  padding: 8px 10px; border-radius: 8px; background: var(--surface-2); margin-bottom: 7px;
  border: 1px solid var(--border); font-size: 12.5px;
}
.note-item.ask { background: var(--st-blocked-bg); border-color: var(--st-blocked-bd); }
.note-item.feedback { background: var(--warn-bg); border-color: var(--warn); }
.note-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.note-by { font-weight: 700; color: var(--text-2); }

.composer { display: flex; gap: 6px; margin-top: 8px; }
.composer textarea, .composer input {
  flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; background: var(--surface);
  resize: vertical; min-height: 36px; outline: none; font-size: 12.5px;
}
.composer textarea:focus, .composer input:focus { border-color: var(--accent); }

/* Graph View */
#main-area { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
#graph-view {
  flex: 1; position: relative; overflow: hidden; cursor: grab;
  background-image: radial-gradient(var(--dot) 1.25px, transparent 1.25px);
  background-size: 20px 20px;
}
#graph-view.panning { cursor: grabbing; }
#canvas-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges-svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 2; }
#edges-svg path.edge-hit { pointer-events: stroke; stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
#edges-svg path.edge-line { fill: none; stroke-width: 2; transition: opacity 0.15s, stroke 0.15s; }

.lane {
  position: absolute; border-radius: 14px; background: var(--lane); border: 1px solid var(--lane-border);
  z-index: 1; transition: opacity 0.15s;
}
.lane-head {
  padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px;
}
.lane-dot { width: 10px; height: 10px; border-radius: 3px; }
.lane-stat { font-size: 11.5px; font-weight: 600; color: var(--text-3); font-family: var(--mono); }
.lane-bar { width: 46px; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
.lane-bar-fill { height: 100%; background: var(--st-done); border-radius: 99px; transition: width 0.2s; }
.lane-add {
  border: 0; background: transparent; color: var(--text-3); width: 22px; height: 22px; border-radius: 6px;
  display: grid; place-items: center; font-size: 15px;
}
.lane-add:hover { background: var(--surface-2); color: var(--text); }

/* Block Card */
.card {
  position: absolute; width: 256px; min-height: 112px; border-radius: 11px; background: var(--surface);
  border: 1.5px solid var(--border); padding: 10px 12px; z-index: 3; box-shadow: var(--shadow);
  cursor: pointer; user-select: none; display: flex; flex-direction: column; gap: 6px;
  transition: box-shadow 0.14s, transform 0.12s, opacity 0.15s, border-color 0.14s;
}
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.card.selected { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-lg); border-color: var(--accent) !important; z-index: 6; }
.card.dim { opacity: 0.28; }
.card.flash { animation: flashPulse 1.2s ease; }
@keyframes flashPulse { 0% { box-shadow: 0 0 0 6px rgba(99,102,241,0.45); } 100% { box-shadow: var(--shadow); } }

.card.st-blocked { background: var(--st-blocked-bg); border-color: var(--st-blocked-bd); border-width: 2px; }
.card.st-locked {
  background: repeating-linear-gradient(-45deg, var(--surface), var(--surface) 8px, var(--st-locked-bg) 8px, var(--st-locked-bg) 16px);
  border-color: var(--st-locked-bd);
}
.card.st-pending { background: var(--st-pending-bg); border-color: var(--st-pending-bd); }
.card.st-processing { background: var(--st-processing-bg); border-color: var(--st-processing-bd); border-width: 2px; }
.card.st-solved { background: var(--st-solved-bg); border-color: var(--st-solved-bd); }

.card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card-id { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--text-3); }
.card-badges { display: flex; align-items: center; gap: 4px; }
.st-pill {
  font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; letter-spacing: 0.01em;
}
.st-pill.blocked { background: var(--st-blocked); color: #fff; }
.st-pill.locked { background: var(--st-locked-bg); color: var(--st-locked); border: 1px solid var(--st-locked-bd); }
.st-pill.pending { background: var(--st-pending-bg); color: var(--st-pending); border: 1px solid var(--st-pending-bd); }
.st-pill.processing { background: var(--st-processing); color: #fff; }
.st-pill.solved { background: var(--st-solved-bg); color: var(--st-solved); border: 1px solid var(--st-solved-bd); }
.card-title { font-weight: 700; font-size: 13.5px; line-height: 1.3; color: var(--text); }
.card-snippet {
  font-size: 11.5px; color: var(--text-2); line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-foot {
  margin-top: auto; display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: var(--text-3); padding-top: 4px; gap: 6px;
}
.card-heurs { display: flex; gap: 3px; flex-wrap: wrap; overflow: hidden; max-height: 18px; }
.mini-h {
  font-family: var(--mono); font-size: 9.5px; padding: 0 4px; border-radius: 4px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
}

/* Connection Ports */
.port {
  position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--surface);
  border: 2px solid var(--accent); opacity: 0; transition: opacity 0.12s, transform 0.12s; z-index: 8; cursor: crosshair;
}
.card:hover .port, .connecting .port { opacity: 1; }
.port:hover { transform: scale(1.3); background: var(--accent); }
.port.in { left: -6px; top: 50%; margin-top: -6px; }
.port.out { right: -6px; top: 50%; margin-top: -6px; }
.vertical .port.in { left: 50%; top: -6px; margin-left: -6px; margin-top: 0; }
.vertical .port.out { left: 50%; bottom: -6px; top: auto; margin-left: -6px; margin-top: 0; }

/* Zoom HUD */
#zoom-hud {
  position: absolute; right: 16px; bottom: 16px; z-index: 15;
  display: flex; align-items: center; gap: 6px; padding: 5px 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 99px; box-shadow: var(--shadow);
}
#zoom-hud input[type="range"] { width: 78px; accent-color: var(--accent); }
#zoom-hud button { border: 0; background: transparent; padding: 2px 5px; border-radius: 6px; color: var(--text-2); font-weight: 700; }
#zoom-hud button:hover { background: var(--surface-2); color: var(--text); }
#zoom-pct { font-size: 11.5px; font-family: var(--mono); min-width: 36px; text-align: center; color: var(--text-2); }

/* Board (Kanban) View */
#board-view {
  flex: 1; display: none; gap: 12px; padding: 14px; overflow-x: auto; align-items: flex-start;
}
#board-view.active { display: flex; }
.kcol {
  width: 278px; min-width: 260px; max-height: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
}
.kcol.dragover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.kcol-head {
  padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px;
}
.kcol-list { padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; min-height: 80px; }
.kcard {
  position: relative !important; width: auto !important; left: auto !important; top: auto !important;
}

/* Substances & Basis View */
#substances-view {
  flex: 1; display: none; overflow-y: auto; padding: 18px 24px 40px;
}
#substances-view.active { display: block; }
.sub-grid { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.panel-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 16px 18px; box-shadow: var(--shadow);
}
.panel-box h2 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.basis-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); margin-bottom: 4px; }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; background: var(--surface-2);
  font-size: 12.5px; outline: none;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); background: var(--surface); }

.prop-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.prop-table th, .prop-table td { border-bottom: 1px solid var(--border); padding: 8px 9px; text-align: left; }
.prop-table th { font-size: 11px; text-transform: uppercase; color: var(--text-3); background: var(--surface-2); }
.prop-table tr:hover td { background: var(--surface-2); }

.bp-ladder { width: 100%; height: 148px; display: block; }

/* Popovers, Menus, Modals & Drawers */
.menu {
  position: fixed; z-index: 60; min-width: 210px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow-lg); padding: 5px; display: none;
}
.menu.open { display: block; }
.menu-item {
  width: 100%; border: 0; background: transparent; padding: 7px 10px; border-radius: 7px; text-align: left;
  font-size: 12.5px; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text);
}

.menu-item.danger { color: #dc2626; }
.menu-sep { height: 1px; background: var(--border); margin: 4px 0; }
.menu-hdr { padding: 5px 10px; font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; }

.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 70; display: none; justify-content: flex-end;
}
.drawer-backdrop.open { display: flex; }
.drawer {
  width: 560px; max-width: 96vw; background: var(--surface); height: 100%; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); border-left: 1px solid var(--border);
}
.drawer-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px; }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 80; display: none; place-items: center;
}
.modal-backdrop.open { display: grid; }
.modal {

  box-shadow: var(--shadow-lg); padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto;
}

#toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 7px; }
.toast {

[data-theme="dark"] .toast { background: #eef2fa; color: #161b26; }

.toast button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; padding: 2px 7px; font-size: 11.5px; font-weight: 600; }

  border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
